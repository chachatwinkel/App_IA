{% extends "base.html" %}

{% block title %}Iniciar sesión · Gestor de incidencias{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
  <section class="login-card">
    <div class="brand-mark" aria-hidden="true">GI</div>
    <p class="eyebrow">Soporte informático</p>
    <h1>Bienvenido</h1>
    <p class="muted-text">Inicia sesión para gestionar tus incidencias.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" placeholder="Tu usuario" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="button button--primary button--full">Entrar</button>
    </form>
  </section>
{% endblock %}
