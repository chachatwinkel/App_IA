{% extends "base.html" %}

{% block title %}{{ role_label }} · Gestor de incidencias{% endblock %}

{% block content %}
  <h1>Gestor de incidencias</h1>
  <p>Sesión: {{ session["username"] }} ({{ role_label }})</p>
  <p>El panel está preparado para añadir las funciones de incidencias.</p>
  <form action="{{ url_for('logout') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Cerrar sesión</button>
  </form>
{% endblock %}
